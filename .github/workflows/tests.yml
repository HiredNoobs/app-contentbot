name: Tests

# Every branch, pull requests, and the release workflow (workflow_call) before it builds an image.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc \
            build-essential

      - name: Install project with dev extras
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest --cov=contentbot --cov-report=html --cov-fail-under=20

      - name: Run mypy
        run: |
          mypy --install-types --non-interactive src/contentbot

      - name: Run flake8
        run: |
          flake8 src/contentbot tests

      - name: Run isort
        run: |
          isort --check-only --diff src/contentbot tests

      - name: Run black
        run: |
          black --check --diff src/contentbot tests
